<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Turtle Beach Huts Karachi — Luxury Beach Huts on Karachi's Shore</title>
<meta name="description" content="Private luxury beach huts on Karachi Beach. Family, BBQ, corporate and weekend packages, sunset views, and premium hospitality — book Turtle Beach Huts Karachi online.">
<link rel="icon" href="images/logo.png" style="border-radius: 35px;">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  body{background:linear-gradient(150deg,var(--sunset-deep),var(--sunset) 45%,var(--lagoon-deep)) !important;height:100vh;margin:0;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .splash-wrap{text-align:center;color:#fff;position:relative;z-index:2;}
  .splash-logo{width:120px;height:120px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 1.4rem;box-shadow:0 30px 70px -20px rgba(0,0,0,.5);animation:riseIn 1s cubic-bezier(.22,1,.36,1);}
  .splash-logo img{width:88px;height:88px;object-fit:contain;}
  @keyframes riseIn{0%{opacity:0;transform:translateY(30px) scale(.85);}100%{opacity:1;transform:translateY(0) scale(1);}}
  .splash-title{font-family:'Fraunces',serif;font-size:1.9rem;font-weight:700;letter-spacing:-.01em;opacity:0;animation:fadeUp .8s .3s cubic-bezier(.22,1,.36,1) forwards;}
  .splash-sub{font-family:'Manrope',sans-serif;font-size:.85rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.75);margin-top:.4rem;opacity:0;animation:fadeUp .8s .5s cubic-bezier(.22,1,.36,1) forwards;}
  @keyframes fadeUp{0%{opacity:0;transform:translateY(14px);}100%{opacity:1;transform:translateY(0);}}
  .splash-bar{width:200px;height:3px;background:rgba(255,255,255,.25);border-radius:99px;margin:2rem auto 0;overflow:hidden;opacity:0;animation:fadeUp .6s .7s forwards;}
  .splash-bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,#F6C445,#fff);animation:fillBar 1.6s .8s cubic-bezier(.4,0,.2,1) forwards;}
  @keyframes fillBar{to{width:100%;}}
  .splash-shape{position:absolute;border-radius:50%;opacity:.18;filter:blur(1px);}
  .sh1{width:260px;height:260px;background:#F6C445;top:-60px;left:-60px;}
  .sh2{width:200px;height:200px;background:#fff;bottom:-70px;right:-40px;}
</style>
<!-- App / PWA -->
<meta name="theme-color" content="#E8722C" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B211F" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TBHK">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="images/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="images/icons/favicon-32.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="splash-shape sh1"></div>
  <div class="splash-shape sh2"></div>
  <div class="splash-wrap">
    <div class="splash-logo"><img src="./images/logo.png" style="border-radius: 35px;" alt="Turtle Beach Huts Karachi logo"></div>
    <div class="splash-title">Turtle Beach Huts Karachi</div>
    <div class="splash-sub">Where the tide meets luxury</div>
    <div class="g-bubbles on-dark" role="status" aria-label="Loading"><i></i><i></i><i></i><i></i></div>
  </div>

  <script>
    // Route after the brand moment: signed-in users go straight to Home,
    // everyone else meets the login / register screen first. Session is
    // written by js/auth.js (real Firebase session or demo/local session —
    // either way it lands in localStorage under 'tbhk-session').
    setTimeout(() => {
      let session = null;
      try { session = JSON.parse(localStorage.getItem('tbhk-session') || 'null'); } catch (e) {}
      window.location.href = session ? 'home.html' : 'auth.html';
    }, 2200);
  </script>
<script src="js/app.js" defer></script>
</body>
</html>
