<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sign In — Turtle Beach Huts Karachi</title>
<meta name="robots" content="noindex">
<link rel="icon" href="images/logo.png" style="border-radius: 35px;">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
<!-- App / PWA -->
<meta name="theme-color" content="#E8722C" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B211F" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TBHK">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="images/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="images/icons/favicon-32.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="auth-page" data-authpage="true">





  <!-- ... this style for only country code use...  -->


  <style>
    .field{margin-bottom:1rem; position:relative;}
.field input, .field select{
  width:100%;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.18);
  color:#fff;
  padding:.75rem 1rem;
  border-radius:12px;
  font-size:.95rem;
  outline:none;
}
.field input::placeholder{color:rgba(255,255,255,.5);}
.field input:focus, .field select:focus{border-color:#2bb3a3;}

.phone-field{margin-bottom:1rem;}
.phone-input-group{
  display:flex;
  align-items:stretch;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.18);
  border-radius:12px;
  overflow:visible;
  position:relative;
}
.phone-input-group:focus-within{border-color:#2bb3a3;}

.country-trigger{
  display:flex; align-items:center; gap:.4rem;
  background:transparent; border:none; color:#fff;
  padding:0 .7rem; cursor:pointer; border-right:1px solid rgba(255,255,255,.18);
  font-size:.9rem; white-space:nowrap;
}
.country-trigger .flag{font-size:1.15rem; line-height:1;}
.country-trigger .dial{color:rgba(255,255,255,.85); font-variant-numeric: tabular-nums;}
.country-trigger i.fa-chevron-down{font-size:.65rem; opacity:.7; margin-left:.15rem;}

.phone-input-group input[type="tel"]{
  flex:1; background:transparent; border:none; color:#fff;
  padding:.75rem .9rem .75rem .2rem; font-size:.95rem; outline:none; min-width:0;
}

.country-dropdown{
  position:absolute; top:calc(100% + 6px); left:0; z-index:50;
  width:300px; max-width:90vw;
  background:#161c27;
  border:1px solid rgba(255,255,255,.18);
  border-radius:12px;
  box-shadow:0 20px 40px rgba(0,0,0,.4);
  display:none;
  overflow:hidden;
}
.country-dropdown.open{display:block;}

.country-search{
  padding:.6rem;
  border-bottom:1px solid rgba(255,255,255,.18);
}
.country-search input{
  width:100%; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.18);
  color:#fff; border-radius:8px; padding:.5rem .7rem; font-size:.85rem; outline:none;
}

.country-list{max-height:260px; overflow-y:auto;}
.country-option{
  display:flex; align-items:center; gap:.6rem;
  padding:.55rem .8rem; cursor:pointer; font-size:.87rem; color:#fff;
}
.country-option:hover, .country-option.active{background:rgba(255,255,255,.08);}
.country-option .flag{font-size:1.05rem;}
.country-option .name{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.country-option .dial{color:rgba(255,255,255,.55); font-variant-numeric: tabular-nums;}
.country-list::-webkit-scrollbar{width:6px;}
.country-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2); border-radius:4px;}

.hint{font-size:.72rem; color:rgba(255,255,255,.55); margin-top:.35rem;}
.hint.error{color:#ff8a8a;}
  </style>










  <div class="auth-bg"></div>
  <div class="shape s1"></div>
  <div class="shape s2"></div>
  <div class="shape s3"></div>
  <div class="shape s4"></div>

  <div class="auth-card">
    <div class="logo-mark"><img src="images/logo.png" style="border-radius: 35px;" alt="TBHK logo"></div>

    <div class="auth-tabs">
      <button class="active" data-target="panel-login">Sign in</button>
      <button data-target="panel-register">Register</button>
    </div>

    <!-- LOGIN -->
    <div class="auth-panel" id="panel-login">
      <form id="loginForm">
        <div class="field">
          <input type="email" id="loginEmail" placeholder="Email address" required>
        </div>
        <div class="field">
          <input type="password" id="loginPassword" placeholder="Password" required>
          <button type="button" class="toggle-eye"><i class="fa-regular fa-eye"></i></button>
        </div>
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3" style="font-size:.85rem;">
          <label style="display:flex;align-items:center;gap:.4rem;cursor:pointer;white-space:nowrap;">
            <input type="checkbox" id="rememberMe" checked> Remember me
          </label>
          <a href="#" data-show-panel="panel-forgot" style="color:var(--gold);">Forgot password?</a>
        </div>
        <button type="submit" id="loginSubmit" class="btn-tbhk btn-sunset w-100 justify-content-center">Sign in</button>
      </form>

      <div class="auth-divider">or continue with</div>
      <button class="social-auth-btn" id="googleBtn"><i class="fa-brands fa-google"></i> Continue with Google</button>
      <button class="social-auth-btn" id="facebookBtn"><i class="fa-brands fa-facebook"></i> Continue with Facebook</button>
      <button class="social-auth-btn" id="guestBtn"><i class="fa-regular fa-user"></i> Continue as Guest</button>
    </div>

    <!-- REGISTER -->
    <div class="auth-panel d-none" id="panel-register">
      <form id="registerForm">
        <div class="field"><input type="text" id="registerName" placeholder="Full name" required></div>
        <div class="field"><input type="email" id="registerEmail" placeholder="Email address" required></div>
        <div class="phone-field">
          <div class="phone-input-group" id="phoneGroup">
            <button type="button" class="country-trigger" id="countryTrigger">
              <span class="flag" id="phoneFlag">🇵🇰</span>
              <span class="dial" id="phoneDial">+92</span>
              <i class="fa-solid fa-chevron-down"></i>
            </button>
            <input type="tel" id="registerPhone" class="phone-number" placeholder="3xx xxxxxxx" inputmode="numeric" required>
            <div class="country-dropdown" id="countryDropdown">
              <div class="country-search">
                <input type="text" id="countrySearchInput" placeholder="Search country or code...">
              </div>
              <div class="country-list" id="countryList"></div>
            </div>
          </div>
          <div class="hint"  id="phoneHint">Full number: <span id="fullNumberPreview">+92</span></div>
        </div>
        
        <div class="field">
          <input type="password" id="registerPassword" placeholder="Create password" required>
          <button type="button" class="toggle-eye"><i class="fa-regular fa-eye"></i></button>
        </div>
        <div class="strength-meter"><span id="strengthBar"></span></div>
        <div style="font-size:.75rem;color:rgba(255,255,255,.7);margin:-.6rem 0 1rem;" id="strengthLabel">Password strength</div>
        <div class="field">
          <input type="password" id="registerConfirm" placeholder="Confirm password" required>
        </div>
        <button type="submit" id="registerSubmit" class="btn-tbhk btn-sunset w-100 justify-content-center">Create account</button>
      </form>
      <p style="font-size:.78rem;color:rgba(255,255,255,.65);margin-top:1rem;text-align:center;">
        By registering you agree to our <a href="terms.html" style="text-decoration:underline;">Terms</a> and <a href="privacy.html" style="text-decoration:underline;">Privacy Policy</a>.
      </p>
    </div>

    <!-- FORGOT PASSWORD -->
    <div class="auth-panel d-none" id="panel-forgot">
      <p style="font-size:.9rem;color:rgba(255,255,255,.85);margin-bottom:1.2rem;">Enter the email on your account — we'll send a reset link.</p>
      <form id="forgotForm">
        <div class="field"><input type="email" id="forgotEmail" placeholder="Email address" required></div>
        <button type="submit" id="forgotSubmit" class="btn-tbhk btn-sunset w-100 justify-content-center">Send reset link</button>
      </form>
      <p style="text-align:center;margin-top:1rem;"><a href="#" data-show-panel="panel-login" style="color:var(--gold);font-size:.85rem;">← Back to sign in</a></p>
    </div>

    <!-- SUCCESS -->
    <div class="auth-panel d-none text-center" id="authSuccess">
      <div class="success-check"><i class="fa-solid fa-check"></i></div>
      <h3 style="color:#fff;font-size:1.4rem;">You're in</h3>
      <p style="color:rgba(255,255,255,.8);font-size:.9rem;">Taking you to Turtle Beach Huts Karachi…</p>
    </div>

    <p class="demo-note" id="modeNote">Checking connection…</p>
  </div>

  <script type="module" src="js/firebase-config.js"></script>
  <script>
    window.addEventListener('tbhk-firebase-ready', (e) => {
      const note = document.getElementById('modeNote');
      if (note) note.textContent = e.detail.live ? 'Secured by Firebase Authentication' : 'Demo mode — accounts are stored on this device only';
    });
  </script>
  <script src="js/auth.js"></script>
  <!-- Demo mode works with zero setup. To go live with real accounts, add
       your project keys to js/firebase-config.js — see the comments at the
       top of that file (and README.md → "Going live with real accounts"). -->


       <script>
        const COUNTRIES = [
        {"code":"PK","name":"Pakistan","dial":"92","minLen":10,"maxLen":10},
        {"code":"US","name":"United States","dial":"1","minLen":10,"maxLen":10},
        {"code":"GB","name":"United Kingdom","dial":"44","minLen":10,"maxLen":10},
        {"code":"IN","name":"India","dial":"91","minLen":10,"maxLen":10},
        {"code":"CA","name":"Canada","dial":"1","minLen":10,"maxLen":10},
        {"code":"AU","name":"Australia","dial":"61","minLen":9,"maxLen":9},
        {"code":"DE","name":"Germany","dial":"49","minLen":10,"maxLen":11},
        {"code":"FR","name":"France","dial":"33","minLen":9,"maxLen":9},
        {"code":"CN","name":"China","dial":"86","minLen":11,"maxLen":11},
        {"code":"SA","name":"Saudi Arabia","dial":"966","minLen":9,"maxLen":9},
        {"code":"AE","name":"United Arab Emirates","dial":"971","minLen":9,"maxLen":9},
        {"code":"BD","name":"Bangladesh","dial":"880","minLen":10,"maxLen":10},
        {"code":"TR","name":"Turkey","dial":"90","minLen":10,"maxLen":10},
        {"code":"JP","name":"Japan","dial":"81","minLen":10,"maxLen":10},
        {"code":"BR","name":"Brazil","dial":"55","minLen":10,"maxLen":11}
        ];
        
        function flagEmoji(iso2){return String.fromCodePoint(...[...iso2.toUpperCase()].map(c=>127397+c.charCodeAt(0)));}
        COUNTRIES.forEach(c=>c.flag=flagEmoji(c.code));
        COUNTRIES.sort((a,b)=>a.name.localeCompare(b.name));
        
        let selectedCountry = COUNTRIES.find(c=>c.code==='PK');
        
        const trigger=document.getElementById('countryTrigger');
        const dropdown=document.getElementById('countryDropdown');
        const listEl=document.getElementById('countryList');
        const searchInput=document.getElementById('countrySearchInput');
        const flagEl=document.getElementById('phoneFlag');
        const dialEl=document.getElementById('phoneDial');
        const phoneInput=document.getElementById('registerPhone');
        const phoneHint=document.getElementById('phoneHint');
        
        function renderList(filter=''){
          const q=filter.trim().toLowerCase();
          listEl.innerHTML='';
          COUNTRIES.filter(c=>c.name.toLowerCase().includes(q)||c.dial.includes(q.replace('+',''))||c.code.toLowerCase().includes(q))
          .forEach(c=>{
            const row=document.createElement('div');
            row.className='country-option'+(c.code===selectedCountry.code?' active':'');
            row.innerHTML=`<span class="flag">${c.flag}</span><span class="name">${c.name}</span><span class="dial">+${c.dial}</span>`;
            row.addEventListener('click',()=>selectCountry(c));
            listEl.appendChild(row);
          });
        }
        
        function selectCountry(c){
          selectedCountry=c;
          flagEl.textContent=c.flag;
          dialEl.textContent='+'+c.dial;
          closeDropdown();
          phoneInput.setAttribute('maxlength',c.maxLen);
          phoneInput.placeholder=`Enter ${c.maxLen}-digit number`;
          phoneInput.value=phoneInput.value.replace(/\D/g,'').slice(0,c.maxLen);
          phoneInput.dispatchEvent(new Event('input'));
          phoneInput.focus();
        }
        
        function openDropdown(){dropdown.classList.add('open');searchInput.value='';renderList();setTimeout(()=>searchInput.focus(),0);}
        function closeDropdown(){dropdown.classList.remove('open');}
        trigger.addEventListener('click',e=>{e.stopPropagation();dropdown.classList.contains('open')?closeDropdown():openDropdown();});
        document.addEventListener('click',e=>{if(!dropdown.contains(e.target)&&e.target!==trigger)closeDropdown();});
        searchInput.addEventListener('input',()=>renderList(searchInput.value));
        
        phoneInput.addEventListener('input',()=>{
          let digits=phoneInput.value.replace(/\D/g,'');
          if(digits.length>selectedCountry.maxLen) digits=digits.slice(0,selectedCountry.maxLen);
          phoneInput.value=digits;
          if(digits.length===0){
            phoneHint.classList.remove('error');
            phoneHint.innerHTML=`Full number: <span id="fullNumberPreview">+${selectedCountry.dial}</span>`;
          } else if(digits.length<selectedCountry.minLen){
            phoneHint.classList.add('error');
            phoneHint.textContent=`Too short — needs ${selectedCountry.minLen===selectedCountry.maxLen?selectedCountry.minLen:selectedCountry.minLen+'-'+selectedCountry.maxLen} digits.`;
          } else {
            phoneHint.classList.remove('error');
            phoneHint.innerHTML=`Full number: <span id="fullNumberPreview">+${selectedCountry.dial}${digits}</span>`;
          }
        });
        
        phoneInput.setAttribute('maxlength',selectedCountry.maxLen);
        phoneInput.dispatchEvent(new Event('input'));

        // ---- Expose validated E.164 phone number to auth.js ----
        // auth.js reads this on register-form submit to save the number
        // (e.g. "+923001234567") to the Firestore user document.
        window.tbhkGetFullPhone = function () {
          const digits = phoneInput.value.replace(/\D/g, '');
          if (digits.length < selectedCountry.minLen) return null; // invalid/incomplete
          return '+' + selectedCountry.dial + digits;
        };
        </script>

<script src="js/app.js" defer></script>
</body>
</html>
